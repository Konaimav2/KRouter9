services:
  krouter9:
    build: .
    image: krouter9:latest
    container_name: krouter9
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      # No defaults on purpose. A published JWT_SECRET lets anyone forge auth tokens
      # offline, and a published password is a login. Both must be supplied by the
      # operator (a .env file beside this compose file); compose aborts if either is unset.
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?set INITIAL_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
