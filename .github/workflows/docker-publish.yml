name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR references must be lowercase. github.repository preserves the owner's
      # casing (e.g. Konaimav2/KRouter9), which is valid for the metadata-action tags
      # but rejected outright by buildx for the registry cache refs.
      - name: Compute lowercase image reference
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GHCR_TOKEN is required while the ghcr.io/konaimav2/krouter9 package is not
      # connected to this repository: a repo-scoped GITHUB_TOKEN cannot push to an
      # unlinked package (denied: permission_denied: write_package). GITHUB_TOKEN
      # remains the fallback so this keeps working once the package is linked.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false