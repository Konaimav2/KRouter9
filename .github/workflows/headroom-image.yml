name: Build Headroom Image

on:
  push:
    tags:
      - "headroom-v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/headroom
          push: true
          tags: |
            ghcr.io/konaimav2/headroom:0.42.0
            ghcr.io/konaimav2/headroom:latest
          platforms: linux/amd64
          provenance: false
          sbom: false
